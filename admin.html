<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 - 三晶プロダクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-hi: #8B0A1A;
    --color-hi-deep: #6B0814;
    --color-edo: #1A2840;
    --color-base: #F5F0E8;
    --color-base-deep: #EDE5D5;
    --color-gold: #B8860B;
    --color-moegi: #2A5C3D;
    --color-sumi: #2C2C2C;
    --color-sumi-light: #555555;
    --serif: "Noto Serif JP", serif;
    --sans: "Noto Sans JP", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--color-base);
    color: var(--color-edo);
    min-height: 100vh;
  }

  /* Header */
  .admin-header {
    background: var(--color-edo);
    color: var(--color-base);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .admin-header h1 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .admin-header a {
    color: var(--color-base);
    text-decoration: none;
    font-size: 14px;
    opacity: 0.8;
  }

  .admin-header a:hover { opacity: 1; }

  /* Login Form */
  .login-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 48px;
    background: white;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  .login-container h2 {
    font-family: var(--serif);
    font-size: 24px;
    text-align: center;
    margin-bottom: 32px;
    color: var(--color-edo);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--color-edo);
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    border: 1px solid rgba(26,40,64,0.2);
    background: var(--color-base);
    font-family: var(--sans);
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--color-hi);
  }

  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    font-family: var(--serif);
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--color-hi);
    color: white;
    width: 100%;
  }

  .btn-primary:hover {
    background: var(--color-hi-deep);
  }

  .btn-secondary {
    background: var(--color-edo);
    color: white;
  }

  .btn-secondary:hover {
    background: #2A3A55;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--color-edo);
    color: var(--color-edo);
  }

  .btn-outline:hover {
    background: var(--color-edo);
    color: white;
  }

  .error-message {
    background: rgba(139,10,26,0.1);
    border: 1px solid var(--color-hi);
    color: var(--color-hi);
    padding: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
  }

  .success-message {
    background: rgba(42,92,61,0.1);
    border: 1px solid var(--color-moegi);
    color: var(--color-moegi);
    padding: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
  }

  /* Admin Dashboard */
  .admin-container {
    display: none;
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px;
  }

  .admin-nav {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    border-bottom: 1px solid rgba(26,40,64,0.15);
    padding-bottom: 16px;
  }

  .admin-nav button {
    padding: 10px 20px;
    background: none;
    border: none;
    font-family: var(--serif);
    font-size: 14px;
    cursor: pointer;
    color: var(--color-sumi-light);
    border-bottom: 2px solid transparent;
    margin-bottom: -17px;
    padding-bottom: 14px;
  }

  .admin-nav button.active {
    color: var(--color-hi);
    border-bottom-color: var(--color-hi);
  }

  .admin-panel {
    display: none;
  }

  .admin-panel.active {
    display: block;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .panel-header h3 {
    font-family: var(--serif);
    font-size: 22px;
  }

  /* Event Form */
  .event-form {
    background: white;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-row.full {
    grid-template-columns: 1fr;
  }

  .form-actions {
    display: flex;
    gap: 16px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(26,40,64,0.1);
  }

  /* Event List */
  .event-list {
    background: white;
  }

  .event-item {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(26,40,64,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .event-item:last-child {
    border-bottom: none;
  }

  .event-info h4 {
    font-family: var(--serif);
    font-size: 16px;
    margin-bottom: 4px;
  }

  .event-info p {
    font-size: 13px;
    color: var(--color-sumi-light);
  }

  .event-id {
    font-size: 12px;
    color: var(--color-hi);
    font-family: monospace;
  }

  .event-actions {
    display: flex;
    gap: 8px;
  }

  .event-actions button {
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .no-events {
    text-align: center;
    padding: 48px;
    color: var(--color-sumi-light);
  }

  /* User info */
  .user-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .user-info span {
    font-size: 14px;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
  }

  .logout-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  @media (max-width: 768px) {
    .form-row {
      grid-template-columns: 1fr;
    }

    .admin-container {
      padding: 16px;
    }

    .event-form {
      padding: 20px;
    }
  }

  /* ===== 基本情報設定 ===== */
  .settings-group {
    margin-bottom: 32px;
  }
  .settings-group > h4 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: .04em;
    color: #1A2840;
    border-bottom: 2px solid #1A2840;
    padding-bottom: 6px;
  }
  .settings-group > p.group-note {
    margin: 8px 0 16px;
    font-size: 13px;
    color: #6b6257;
    line-height: 1.7;
  }
  .settings-item {
    margin-bottom: 18px;
  }
  .settings-item label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .settings-item input[type="text"],
  .settings-item input[type="tel"],
  .settings-item input[type="url"],
  .settings-item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c9bfae;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .settings-item textarea {
    min-height: 90px;
    resize: vertical;
  }
  .settings-item .note {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #6b6257;
    line-height: 1.6;
  }
  .settings-item.is-bool {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .settings-item.is-bool input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    flex: 0 0 auto;
  }
  .settings-item.is-bool > div {
    flex: 1;
  }
  .settings-actions {
    position: sticky;
    bottom: 0;
    background: #fff;
    border-top: 1px solid #e0d8c8;
    padding: 14px 0 4px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .settings-actions .hint {
    font-size: 12px;
    color: #6b6257;
  }
</style>
</head>
<body>

<header class="admin-header">
  <h1>三晶プロダクション 管理画面</h1>
  <div class="user-info" id="userInfo" style="display: none;">
    <span id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
  <a href="index.html" id="backLink">← サイトに戻る</a>
</header>

<!-- Login Form -->
<div class="login-container" id="loginContainer">
  <h2>管理者ログイン</h2>
  <div class="error-message" id="loginError"></div>
  <form onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" required placeholder="admin@example.com">
    </div>
    <div class="form-group">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" required placeholder="パスワード">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">ログイン</button>
  </form>
</div>

<!-- Admin Dashboard -->
<div class="admin-container" id="adminContainer">
  <nav class="admin-nav">
    <button class="active" onclick="showPanel('events')">イベント管理</button>
    <button onclick="showPanel('applications')">イベント申込</button>
    <button onclick="showPanel('supporters')">サポーター一覧</button>
    <button onclick="showPanel('settings')">基本情報設定</button>
  </nav>

  <!-- Events Panel -->
  <div class="admin-panel active" id="panelEvents">
    <div class="panel-header">
      <h3>イベント管理</h3>
      <button class="btn btn-secondary" onclick="showEventForm()">+ 新規イベント登録</button>
    </div>

    <!-- Event Form -->
    <div class="event-form" id="eventForm" style="display: none;">
      <div class="success-message" id="eventSuccess"></div>
      <div class="error-message" id="eventError"></div>

      <input type="hidden" id="editEventId">

      <div class="form-row">
        <div class="form-group">
          <label for="eventTitle">イベント名 *</label>
          <input type="text" id="eventTitle" required placeholder="第1回落語【風と曼荼羅】">
        </div>
        <div class="form-group">
          <label for="eventDate">開催日 *</label>
          <input type="date" id="eventDate" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventOpenTime">開場時間</label>
          <input type="time" id="eventOpenTime" placeholder="18:00">
        </div>
        <div class="form-group">
          <label for="eventStartTime">開演時間 *</label>
          <input type="time" id="eventStartTime" required placeholder="19:00">
        </div>
      </div>

      <!-- 主催が三晶以外の場合、公開サイト側は申し込みボタンを出さず
           下の「問い合わせ先」を表示する。空欄は自主公演扱い。 -->
      <div class="form-row full">
        <div class="form-group">
          <label for="eventOrganizer">主催</label>
          <input type="text" id="eventOrganizer" placeholder="三晶プロダクション（空欄なら自主公演として申し込みを受け付けます）">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventVenue">会場名 *</label>
          <input type="text" id="eventVenue" required placeholder="おでん 髪と台詞">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventAddress">会場住所</label>
          <input type="text" id="eventAddress" placeholder="福島県白河市天神町６">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventVenueUrl">会場URL</label>
          <input type="url" id="eventVenueUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="eventMapUrl">地図URL</label>
          <input type="url" id="eventMapUrl" placeholder="https://maps.app.goo.gl/...">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventPrice">木戸銭（料金）</label>
          <input type="text" id="eventPrice" placeholder="5,000円（食事付き／追加注文別料金）">
        </div>
        <div class="form-group">
          <label for="eventCapacity">定員</label>
          <input type="text" id="eventCapacity" placeholder="30名">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventPerformer">出演者 *</label>
          <input type="text" id="eventPerformer" required placeholder="三遊亭円左衛門">
        </div>
      </div>

      <!-- この欄は price_includes 列に保存される。「演目」と表示されていたが
           実際に入っていたのは木戸銭の但し書きなので、ラベルを実態に合わせた。 -->
      <div class="form-row full">
        <div class="form-group">
          <label for="eventPriceIncludes">料金内訳・但し書き</label>
          <textarea id="eventPriceIncludes" placeholder="木戸銭：2,000円（ワンドリンク付） / 入場無料"></textarea>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventProgram">出し物</label>
          <textarea id="eventProgram" placeholder="「たらちね」「蒟蒻問答」"></textarea>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventContact">問い合わせ先（主催が三晶以外のときサイトに表示）</label>
          <textarea id="eventContact" placeholder="電話: 0248-XX-XXXX&#10;メール: info@example.com&#10;※URL・メール・電話番号は自動でリンクになります"></textarea>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventSpecial">特典・備考</label>
          <textarea id="eventSpecial" placeholder="ご来場のお客様にはもれなく、円左衛門変顔缶バッチプレゼント！"></textarea>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="eventImageUrl">イベント画像URL</label>
          <input type="url" id="eventImageUrl" placeholder="https://example.com/image.jpg" onchange="previewImage()">
          <div id="imagePreview" style="margin-top: 10px; display: none;">
            <img id="previewImg" style="max-width: 300px; max-height: 200px; border: 1px solid rgba(26,40,64,0.2);">
          </div>
          <p style="font-size: 12px; color: var(--color-sumi-light); margin-top: 8px;">
            Google Drive、Imgur等にアップロードした画像の共有URLを入力してください
          </p>
        </div>
      </div>

      <div class="form-group">
        <label for="eventStatus">公開状態</label>
        <select id="eventStatus">
          <option value="draft">下書き</option>
          <option value="published">公開</option>
          <option value="closed">終了</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-primary" onclick="saveEvent()">保存する</button>
        <button type="button" class="btn btn-outline" onclick="hideEventForm()">キャンセル</button>
      </div>
    </div>

    <!-- Event List -->
    <div class="event-list" id="eventList">
      <div class="no-events">イベントを読み込み中...</div>
    </div>
  </div>

  <!-- Applications Panel -->
  <div class="admin-panel" id="panelApplications">
    <style>
      .apps-subnav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; border-bottom:1px solid #e0d8c8; padding-bottom:12px; }
      .apps-subnav button { padding:8px 16px; font-size:14px; background:#f5f0e6; border:1px solid #d8cdb5; border-radius:6px; cursor:pointer; color:#3a3226; }
      .apps-subnav button.active { background:#8B2F26; color:#fff; border-color:#8B2F26; }
      .apps-tab { display:none; }
      .apps-tab.active { display:block; }
      .summary-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
      .summary-card { border:1px solid #e0d8c8; border-radius:10px; padding:16px; background:#fff; }
      .summary-card h4 { margin:0 0 4px; font-size:16px; color:#1A2840; }
      .summary-card .sc-date { font-size:12px; color:#888; margin-bottom:12px; }
      .sc-stats { display:flex; gap:0; text-align:center; margin-bottom:12px; }
      .sc-stats > div { flex:1; }
      .sc-stats .num { font-size:24px; font-weight:bold; line-height:1; }
      .sc-stats .lbl { font-size:11px; color:#888; margin-top:4px; }
      .sc-stats .waku .num { color:#1A2840; }
      .sc-stats .app .num { color:#8B2F26; }
      .sc-stats .rem .num { color:#2A5C3D; }
      .sc-stats .rem.full .num { color:#b00; }
      .sc-bar { height:8px; border-radius:4px; background:#eee; overflow:hidden; }
      .sc-bar > div { height:100%; background:#8B2F26; }
      .sc-drill { margin-top:10px; font-size:13px; color:#8B2F26; cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; }
      .bc-field { margin-bottom:16px; }
      .bc-field label.bc-label { display:block; font-size:13px; font-weight:bold; color:#3a3226; margin-bottom:6px; }
      .bc-field input[type=text], .bc-field select, .bc-field textarea { width:100%; padding:10px; font-size:14px; border:1px solid #d8cdb5; border-radius:6px; box-sizing:border-box; font-family:inherit; }
      .bc-channels { display:flex; flex-wrap:wrap; gap:16px; }
      .bc-channels label { font-size:14px; cursor:pointer; }
      .bc-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
      .bc-btn { padding:12px 24px; font-size:15px; border:none; border-radius:6px; cursor:pointer; }
      .bc-btn.test { background:#f5f0e6; border:1px solid #d8cdb5; color:#3a3226; }
      .bc-btn.send { background:#8B2F26; color:#fff; }
      .bc-btn:disabled { opacity:.5; cursor:not-allowed; }
      .bc-note { font-size:12px; color:#888; margin-top:12px; line-height:1.6; }
    </style>
    <div class="panel-header">
      <h3>イベント申込</h3>
    </div>
    <div class="apps-subnav">
      <button class="active" onclick="showAppsTab('byEvent', this)">📋 イベント別申込</button>
      <button onclick="showAppsTab('summary', this)">📊 集計（枠・申込・残数）</button>
      <button onclick="showAppsTab('past', this)">🗂 過去の実績</button>
      <button onclick="showAppsTab('broadcast', this)">📣 一斉配信</button>
    </div>

    <!-- 1) イベント別申込 -->
    <div class="apps-tab active" id="appsTabByEvent">
      <select id="filterEventId" onchange="loadApplications()" style="padding:8px 16px; font-size:14px; margin-bottom:16px;">
        <option value="">イベントを選択してください…</option>
      </select>
      <div class="event-list" id="applicationList">
        <div class="no-events">上のメニューからイベントを選んでください</div>
      </div>
    </div>

    <!-- 2) 集計 -->
    <div class="apps-tab" id="appsTabSummary">
      <div id="summaryGrid" class="summary-grid"><div class="no-events">読み込み中...</div></div>
    </div>

    <!-- 3) 過去の実績 -->
    <div class="apps-tab" id="appsTabPast">
      <div id="pastGrid" class="summary-grid"><div class="no-events">読み込み中...</div></div>
    </div>

    <!-- 4) 一斉配信 -->
    <div class="apps-tab" id="appsTabBroadcast">
      <div class="success-message" id="bcSuccess" style="display:none;"></div>
      <div class="error-message" id="bcError" style="display:none;"></div>
      <div class="bc-field">
        <label class="bc-label">告知するイベント（選ぶと件名・本文を自動作成）</label>
        <select id="bcEventId" onchange="fillBroadcastBody()">
          <option value="">— イベントを選択 —</option>
        </select>
      </div>
      <div class="bc-field">
        <label class="bc-label">配信チャンネル</label>
        <div class="bc-channels">
          <label><input type="radio" name="bcChannel" value="both" checked> メール ＋ LINE 両方</label>
          <label><input type="radio" name="bcChannel" value="email"> メールのみ</label>
          <label><input type="radio" name="bcChannel" value="line"> LINEのみ</label>
        </div>
      </div>
      <div class="bc-field">
        <label class="bc-label">宛先の範囲</label>
        <label style="font-size:14px; cursor:pointer;">
          <input type="checkbox" id="bcIncludeRes"> 予約者にも送る（会員登録していない申込者のメールも含める）
        </label>
      </div>
      <div class="bc-field">
        <label class="bc-label">件名（メール用）</label>
        <input type="text" id="bcSubject" placeholder="【三晶プロダクション】〇〇公演のお知らせ">
      </div>
      <div class="bc-field">
        <label class="bc-label">本文</label>
        <textarea id="bcBody" rows="12" placeholder="配信する本文を入力してください"></textarea>
      </div>
      <div class="bc-actions">
        <button type="button" class="bc-btn test" id="bcTestBtn" onclick="sendBroadcast(true)">✉ 自分宛にテスト送信</button>
        <button type="button" class="bc-btn send" id="bcSendBtn" onclick="sendBroadcast(false)">📣 全員に一斉配信</button>
      </div>
      <p class="bc-note">
        宛先＝<strong>全員</strong>：メールは有効な全会員（BCC）／LINEは友だち登録済みの全会員（multicast）に届きます。<br>
        一斉配信は<strong>取り消せません</strong>。まず「テスト送信」で自分宛に確認してから送ってください。
      </p>
    </div>
  </div>

  <!-- Supporters Panel -->
  <div class="admin-panel" id="panelSupporters">
    <div class="panel-header">
      <h3>サポーター一覧</h3>
    </div>
    <div class="event-list" id="supporterList">
      <div class="no-events">サポーター情報を読み込み中...</div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="admin-panel" id="panelSettings">
    <div class="panel-header">
      <h3>基本情報設定</h3>
    </div>
    <div class="success-message" id="settingsSuccess"></div>
    <div class="error-message" id="settingsError"></div>
    <div id="settingsForm">
      <div class="no-events">設定を読み込み中...</div>
    </div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsCWJtHZ7SqTCfaKXP8qCrqvHocIfLiCb70sJM_r2BkVlLBaZkgsGuC6pXvbV2rUL8TA/exec';

  // Check session on load
  document.addEventListener('DOMContentLoaded', () => {
    const session = localStorage.getItem('adminSession');
    if (session) {
      const data = JSON.parse(session);
      if (data.expiry > Date.now()) {
        showDashboard(data.email);
        loadEvents();
        return;
      }
      localStorage.removeItem('adminSession');
    }
  });

  // Login handler
  async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'ログイン中...';

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'adminLogin',
          email: email,
          password: password
        })
      });

      // Since no-cors, we assume success and verify on next request
      // Store session
      localStorage.setItem('adminSession', JSON.stringify({
        email: email,
        password: password,
        expiry: Date.now() + (24 * 60 * 60 * 1000) // 24 hours
      }));

      showDashboard(email);
      loadEvents();

    } catch (error) {
      errorEl.textContent = 'ログインに失敗しました';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'ログイン';
    }
  }

  function showDashboard(email) {
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('adminContainer').style.display = 'block';
    document.getElementById('userInfo').style.display = 'flex';
    document.getElementById('backLink').style.display = 'none';
    document.getElementById('userEmail').textContent = email;
  }

  function logout() {
    localStorage.removeItem('adminSession');
    location.reload();
  }

  // Panel navigation
  function showPanel(panelName) {
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));

    document.getElementById('panel' + panelName.charAt(0).toUpperCase() + panelName.slice(1)).classList.add('active');
    event.target.classList.add('active');

    if (panelName === 'supporters') {
      loadSupporters();
    } else if (panelName === 'applications') {
      initApplicationsPanel();
    } else if (panelName === 'settings') {
      loadSettings();
    }
  }

  // ===== 基本情報設定 =====
  // 項目の定義は GAS 側（settings_addition.gs の SETTINGS_DEFINITION）が持っている。
  // ここは受け取った定義どおりに入力欄を描くだけなので、項目を増やしても
  // この画面は触らなくてよい。
  let settingsCache = [];

  async function loadSettings() {
    const container = document.getElementById('settingsForm');
    document.getElementById('settingsSuccess').style.display = 'none';
    document.getElementById('settingsError').style.display = 'none';
    container.innerHTML = '<div class="no-events">設定を読み込み中...</div>';

    try {
      const session = JSON.parse(localStorage.getItem('adminSession'));
      const url = `${GAS_URL}?action=getSettings&email=${encodeURIComponent(session.email)}&password=${encodeURIComponent(session.password)}`;
      const response = await fetch(url);
      const result = await response.json();

      if (!result.success) {
        container.innerHTML = '';
        showSettingsError(result.message === 'Unauthorized'
          ? 'ログインし直してください。'
          : (result.message || '設定を読み込めませんでした。'));
        return;
      }

      settingsCache = result.settings || [];
      renderSettings(settingsCache);
    } catch (error) {
      container.innerHTML = '';
      showSettingsError('設定を読み込めませんでした：' + error.message);
    }
  }

  function renderSettings(items) {
    const container = document.getElementById('settingsForm');

    if (!items.length) {
      container.innerHTML = '<div class="no-events">設定項目がありません。</div>';
      return;
    }

    const groups = [];
    items.forEach(item => {
      let g = groups.find(x => x.name === item.group);
      if (!g) { g = { name: item.group, items: [] }; groups.push(g); }
      g.items.push(item);
    });

    const groupNotes = {
      '通知先': '申し込みや登録が入ったときに、ここに書いたアドレスへメールが届きます。空欄にすると、その通知は送られません。',
      '基本情報': 'サイトやメールに表示される、事務所の連絡先です。',
      '運用': '日々の運用にあわせて変えるものです。'
    };

    container.innerHTML = groups.map(group => `
      <div class="settings-group">
        <h4>${escapeHtml(group.name)}</h4>
        ${groupNotes[group.name] ? `<p class="group-note">${escapeHtml(groupNotes[group.name])}</p>` : ''}
        ${group.items.map(item => renderSettingsItem(item)).join('')}
      </div>
    `).join('') + `
      <div class="settings-actions">
        <button class="btn btn-primary" onclick="saveSettingsForm()" id="settingsSaveBtn">設定を保存</button>
        <span class="hint">保存すると、次の申し込みからこの内容で動きます。</span>
      </div>
    `;
  }

  function renderSettingsItem(item) {
    const id = 'set_' + item.key;
    const note = item.note ? `<span class="note">${escapeHtml(item.note)}</span>` : '';

    if (item.type === 'bool') {
      const checked = String(item.value) === 'true' ? 'checked' : '';
      return `
        <div class="settings-item is-bool">
          <input type="checkbox" id="${id}" data-key="${item.key}" data-type="bool" ${checked}>
          <div>
            <label for="${id}">${escapeHtml(item.label)}</label>
            ${note}
          </div>
        </div>`;
    }

    if (item.type === 'email_list' || item.type === 'textarea') {
      return `
        <div class="settings-item">
          <label for="${id}">${escapeHtml(item.label)}</label>
          <textarea id="${id}" data-key="${item.key}" data-type="${item.type}"
            placeholder="${item.type === 'email_list' ? '例：manager@example.com, staff@example.com' : ''}"
          >${escapeHtml(item.value || '')}</textarea>
          ${note}
        </div>`;
    }

    const inputType = item.type === 'tel' ? 'tel' : (item.type === 'url' ? 'url' : 'text');
    return `
      <div class="settings-item">
        <label for="${id}">${escapeHtml(item.label)}</label>
        <input type="${inputType}" id="${id}" data-key="${item.key}" data-type="${item.type}"
          value="${escapeHtml(item.value || '')}">
        ${note}
      </div>`;
  }

  async function saveSettingsForm() {
    const btn = document.getElementById('settingsSaveBtn');
    document.getElementById('settingsSuccess').style.display = 'none';
    document.getElementById('settingsError').style.display = 'none';

    const settings = {};
    document.querySelectorAll('#settingsForm [data-key]').forEach(el => {
      settings[el.dataset.key] = el.dataset.type === 'bool'
        ? (el.checked ? 'true' : 'false')
        : el.value.trim();
    });

    // 保存前に、この場でメールアドレスの形をひととおり見ておく。
    // GAS側でも同じ検証をしているが、no-cors では結果を読めないため手前で止める。
    const badFields = [];
    settingsCache.filter(i => i.type === 'email_list').forEach(item => {
      const raw = settings[item.key] || '';
      if (!raw) return;
      const bad = raw.split(/[,;\n\r]+/).map(s => s.trim()).filter(s => s && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s));
      if (bad.length) badFields.push(`${item.label}：${bad.join(', ')}`);
    });

    if (badFields.length) {
      showSettingsError('メールアドレスの形式が正しくありません。\n' + badFields.join('\n'));
      return;
    }

    btn.disabled = true;
    btn.textContent = '保存中...';

    try {
      const session = JSON.parse(localStorage.getItem('adminSession'));
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'saveSettings',
          adminEmail: session.email,
          adminPassword: session.password,
          settings: settings
        })
      });

      // no-cors のためレスポンスを読めない。保存できたかどうかは読み直して確かめる。
      await new Promise(r => setTimeout(r, 1200));
      await loadSettings();

      const el = document.getElementById('settingsSuccess');
      el.textContent = '設定を保存しました。上の内容は保存後に読み直したものです。';
      el.style.display = 'block';
    } catch (error) {
      showSettingsError('保存できませんでした：' + error.message);
    } finally {
      const b = document.getElementById('settingsSaveBtn');
      if (b) { b.disabled = false; b.textContent = '設定を保存'; }
    }
  }

  function showSettingsError(message) {
    const el = document.getElementById('settingsError');
    el.textContent = message;
    el.style.display = 'block';
  }

  function escapeHtml(str) {
    return String(str === null || str === undefined ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Event form
  function showEventForm(eventData = null) {
    document.getElementById('eventForm').style.display = 'block';

    if (eventData) {
      document.getElementById('editEventId').value = eventData.event_id || '';
      document.getElementById('eventTitle').value = eventData.title || '';
      document.getElementById('eventDate').value = eventData.date || '';
      document.getElementById('eventOpenTime').value = eventData.time_open || '';
      document.getElementById('eventStartTime').value = eventData.time_start || '';
      document.getElementById('eventOrganizer').value = eventData.organizer || '';
      document.getElementById('eventVenue').value = eventData.venue_name || '';
      document.getElementById('eventAddress').value = eventData.venue_address || '';
      document.getElementById('eventVenueUrl').value = eventData.venue_access || '';
      document.getElementById('eventMapUrl').value = '';
      document.getElementById('eventPrice').value = eventData.price_general || '';
      document.getElementById('eventCapacity').value = eventData.capacity || '';
      document.getElementById('eventPerformer').value = eventData.description || '';
      document.getElementById('eventPriceIncludes').value = eventData.price_includes || '';
      document.getElementById('eventProgram').value = eventData.program || '';
      document.getElementById('eventContact').value = eventData.contact || '';
      document.getElementById('eventSpecial').value = '';
      document.getElementById('eventStatus').value = eventData.status || 'draft';
      document.getElementById('eventImageUrl').value = eventData.image_url || '';
      previewImage();
    } else {
      clearEventForm();
    }
  }

  function previewImage() {
    const url = document.getElementById('eventImageUrl').value;
    const previewDiv = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');

    if (url) {
      previewImg.src = url;
      previewDiv.style.display = 'block';
      previewImg.onerror = () => {
        previewDiv.style.display = 'none';
      };
    } else {
      previewDiv.style.display = 'none';
    }
  }

  function hideEventForm() {
    document.getElementById('eventForm').style.display = 'none';
    clearEventForm();
  }

  function clearEventForm() {
    document.getElementById('editEventId').value = '';
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventOpenTime').value = '';
    document.getElementById('eventStartTime').value = '';
    document.getElementById('eventOrganizer').value = '';
    document.getElementById('eventVenue').value = '';
    document.getElementById('eventAddress').value = '';
    document.getElementById('eventVenueUrl').value = '';
    document.getElementById('eventMapUrl').value = '';
    document.getElementById('eventPrice').value = '';
    document.getElementById('eventCapacity').value = '';
    document.getElementById('eventPerformer').value = '';
    document.getElementById('eventPriceIncludes').value = '';
    document.getElementById('eventProgram').value = '';
    document.getElementById('eventContact').value = '';
    document.getElementById('eventSpecial').value = '';
    document.getElementById('eventStatus').value = 'draft';
    document.getElementById('eventImageUrl').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('eventSuccess').style.display = 'none';
    document.getElementById('eventError').style.display = 'none';
  }

  async function saveEvent() {
    const session = JSON.parse(localStorage.getItem('adminSession') || '{}');
    const successEl = document.getElementById('eventSuccess');
    const errorEl = document.getElementById('eventError');

    successEl.style.display = 'none';
    errorEl.style.display = 'none';

    const eventData = {
      action: 'saveEvent',
      adminEmail: session.email,
      adminPassword: session.password,
      eventId: document.getElementById('editEventId').value,
      title: document.getElementById('eventTitle').value,
      description: document.getElementById('eventPerformer').value,
      date: document.getElementById('eventDate').value,
      timeOpen: document.getElementById('eventOpenTime').value,
      timeStart: document.getElementById('eventStartTime').value,
      timeEnd: '',
      organizer: document.getElementById('eventOrganizer').value,
      contact: document.getElementById('eventContact').value,
      venueName: document.getElementById('eventVenue').value,
      venueAddress: document.getElementById('eventAddress').value,
      venueAccess: document.getElementById('eventVenueUrl').value,
      capacity: document.getElementById('eventCapacity').value,
      priceGeneral: document.getElementById('eventPrice').value,
      priceMember: '',
      priceIncludes: document.getElementById('eventPriceIncludes').value,
      program: document.getElementById('eventProgram').value,
      status: document.getElementById('eventStatus').value,
      imageUrl: document.getElementById('eventImageUrl').value
    };

    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(eventData)
      });

      successEl.textContent = 'イベントを保存しました';
      successEl.style.display = 'block';

      setTimeout(() => {
        hideEventForm();
        loadEvents();
      }, 1500);

    } catch (error) {
      errorEl.textContent = '保存に失敗しました';
      errorEl.style.display = 'block';
    }
  }

  async function loadEvents() {
    const listEl = document.getElementById('eventList');
    listEl.innerHTML = '<div class="no-events">読み込み中...</div>';

    // For now, show placeholder - will load from GAS
    try {
      const session = JSON.parse(localStorage.getItem('adminSession') || '{}');
      console.log('loadEvents - Session:', session);
      if (!session.email || !session.password) {
        listEl.innerHTML = '<div class="no-events">ログインしてください</div>';
        return;
      }

      const eventsUrl = `${GAS_URL}?action=getEvents&email=${encodeURIComponent(session.email)}&password=${encodeURIComponent(session.password)}`;
      console.log('Fetching events from:', eventsUrl);
      const response = await fetch(eventsUrl, {
        method: 'GET',
        redirect: 'follow'
      });
      console.log('Events response:', response.status, response.ok);

      if (response.ok) {
        const data = await response.json();
        console.log('Events data:', data);
        if (data.events && data.events.length > 0) {
          renderEventList(data.events);
        } else {
          listEl.innerHTML = '<div class="no-events">イベントがありません</div>';
        }
      } else {
        listEl.innerHTML = '<div class="no-events">イベント一覧を取得できませんでした</div>';
      }
    } catch (error) {
      console.error('loadEvents error:', error);
      listEl.innerHTML = '<div class="no-events">イベント一覧を取得できませんでした</div>';
    }
  }

  function renderEventList(events) {
    const listEl = document.getElementById('eventList');
    listEl.innerHTML = events.map(ev => `
      <div class="event-item">
        <div class="event-info">
          <span class="event-id">${ev.event_id}</span>
          <h4>${ev.title}</h4>
          <p>${ev.date} ${ev.time_start} / ${ev.venue_name}</p>
          ${ev.organizer && !/三晶|円左衛門|mitsuakira/i.test(ev.organizer)
            ? `<p style="color:#8B0A1A;">主催: ${ev.organizer}（申し込み受付なし・問い合わせ表示）</p>` : ''}
        </div>
        <div class="event-actions">
          <button class="btn btn-outline" onclick='showEventForm(${JSON.stringify(ev)})'>編集</button>
        </div>
      </div>
    `).join('');
  }

  async function loadSupporters() {
    const listEl = document.getElementById('supporterList');
    listEl.innerHTML = '<div class="no-events">読み込み中...</div>';

    try {
      const session = JSON.parse(localStorage.getItem('adminSession') || '{}');
      console.log('Session data:', session);
      if (!session.email || !session.password) {
        listEl.innerHTML = '<div class="no-events">ログインしてください</div>';
        return;
      }
      const membersUrl = `${GAS_URL}?action=getMembers&email=${encodeURIComponent(session.email)}&password=${encodeURIComponent(session.password)}`;
      console.log('Fetching members from:', membersUrl);
      const response = await fetch(membersUrl, {
        method: 'GET',
        redirect: 'follow'
      });
      console.log('Response status:', response.status, response.ok);
      if (response.ok) {
        const data = await response.json();
        console.log('Members data:', data);
        if (data.members && data.members.length > 0) {
          listEl.innerHTML = data.members.map(s => `
            <div class="event-item">
              <div class="event-info">
                <span class="event-id">${s.member_id || '-'}</span>
                <h4>${s.name || '(未登録)'}</h4>
                <p>${s.email || ''} / ${s.plan || '-'} / ${s.status || ''}</p>
              </div>
            </div>
          `).join('');
        } else {
          listEl.innerHTML = '<div class="no-events">サポーターがいません</div>';
        }
      } else {
        console.error('Response not ok:', response.status);
        listEl.innerHTML = '<div class="no-events">読み込みに失敗しました</div>';
      }
    } catch (error) {
      console.error('Load supporters error:', error);
      listEl.innerHTML = '<div class="no-events">読み込みに失敗しました</div>';
    }
  }

  // ===== イベント申込ダッシュボード =====
  // 全イベント・全予約をここに一度だけ取り込み、各サブタブで使い回す。
  let appsEventsCache = [];
  let appsReservationsCache = [];
  let appsLoaded = false;

  function adminSession_() {
    return JSON.parse(localStorage.getItem('adminSession') || '{}');
  }

  // 「30名」「30」いずれも数値化。数字がなければ 0。
  function parseCapacity_(v) {
    if (v === null || v === undefined) return 0;
    const m = String(v).match(/\d+/);
    return m ? parseInt(m[0], 10) : 0;
  }

  // 開催日が今日より前かどうか（過去実績の判定）
  function isPastDate_(dateStr) {
    if (!dateStr) return false;
    const d = new Date(String(dateStr).replace(/-/g, '/'));
    if (isNaN(d.getTime())) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return d < today;
  }

  // サブタブ切替
  function showAppsTab(name, btn) {
    document.querySelectorAll('#panelApplications .apps-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.apps-subnav button').forEach(b => b.classList.remove('active'));
    const map = { byEvent: 'appsTabByEvent', summary: 'appsTabSummary', past: 'appsTabPast', broadcast: 'appsTabBroadcast' };
    document.getElementById(map[name]).classList.add('active');
    if (btn) btn.classList.add('active');
  }

  // パネル表示時：データを取り込み、各ビューを描く
  async function initApplicationsPanel() {
    if (!appsLoaded) {
      await refreshApplicationsData();
    }
    renderEventOptions();
    renderSummary();
    renderPast();
    renderBroadcastEventOptions();
  }

  // 全イベント＋全予約をまとめて取得
  async function refreshApplicationsData() {
    const session = adminSession_();
    if (!session.email || !session.password) return;
    const q = `email=${encodeURIComponent(session.email)}&password=${encodeURIComponent(session.password)}`;
    try {
      const [evRes, resRes] = await Promise.all([
        fetch(`${GAS_URL}?action=getEvents&${q}`),
        fetch(`${GAS_URL}?action=getReservations&${q}`)
      ]);
      const evData = await evRes.json();
      const resData = await resRes.json();
      appsEventsCache = (evData && evData.events) ? evData.events : [];
      appsReservationsCache = (resData && resData.reservations) ? resData.reservations : [];
      appsLoaded = true;
    } catch (e) {
      console.error('refreshApplicationsData error', e);
    }
  }

  // イベント別申込：予約件数を event_id ごとに集計（party_size 合計）
  function appsCountsByEvent_() {
    const counts = {};
    appsReservationsCache.forEach(r => {
      // キャンセルは数えない
      if (r.status === 'cancelled' || r.status === 'canceled') return;
      const id = r.event_id || '';
      const size = parseInt(r.party_size, 10) || 1;
      counts[id] = (counts[id] || 0) + size;
    });
    return counts;
  }

  // ---- 1) イベント別申込 ----
  function renderEventOptions() {
    const select = document.getElementById('filterEventId');
    const current = select.value;
    select.innerHTML = '<option value="">イベントを選択してください…</option>' +
      appsEventsCache.map(ev =>
        `<option value="${ev.event_id}">${ev.title || ev.event_id} (${ev.date || ''})</option>`
      ).join('');
    if (current) select.value = current;
  }

  function loadApplications() {
    const listEl = document.getElementById('applicationList');
    const eventId = document.getElementById('filterEventId').value;
    if (!eventId) {
      listEl.innerHTML = '<div class="no-events">上のメニューからイベントを選んでください</div>';
      return;
    }
    const ev = appsEventsCache.find(e => e.event_id === eventId);
    const list = appsReservationsCache.filter(r => r.event_id === eventId);
    const cap = ev ? parseCapacity_(ev.capacity) : 0;
    const applied = list
      .filter(r => r.status !== 'cancelled' && r.status !== 'canceled')
      .reduce((s, r) => s + (parseInt(r.party_size, 10) || 1), 0);
    const remain = cap ? Math.max(cap - applied, 0) : null;

    const header = `
      <div class="summary-card" style="margin-bottom:16px;">
        <h4>${ev ? (ev.title || ev.event_id) : eventId}</h4>
        <div class="sc-date">${ev ? (ev.date || '') : ''} ${ev && ev.venue_name ? '／ ' + ev.venue_name : ''}</div>
        <div class="sc-stats">
          <div class="waku"><div class="num">${cap || '—'}</div><div class="lbl">枠</div></div>
          <div class="app"><div class="num">${applied}</div><div class="lbl">申込</div></div>
          <div class="rem ${remain === 0 ? 'full' : ''}"><div class="num">${remain === null ? '—' : remain}</div><div class="lbl">残数</div></div>
        </div>
      </div>`;

    if (list.length === 0) {
      listEl.innerHTML = header + '<div class="no-events">このイベントの申込はまだありません</div>';
      return;
    }

    listEl.innerHTML = header + list.map(res => `
      <div class="event-item">
        <div class="event-info">
          <span class="event-id">${res.reservation_id || ''}</span>
          <h4>${res.name || res.member_id || '(名前なし)'}</h4>
          <p>
            ${res.channel || 'web'} / ${res.party_size || 1}名 / ${res.email || ''}<br>
            ${res.phone ? `TEL: ${res.phone}` : ''}
            ${res.notes ? `<br>備考: ${res.notes}` : ''}
          </p>
        </div>
        <div class="event-actions">
          <span style="font-size:12px; color:${res.status === 'confirmed' ? '#2A5C3D' : '#666'};">
            ${res.status === 'confirmed' ? '確定' : res.status === 'pending' ? '仮予約' : res.status || ''}
          </span>
        </div>
      </div>
    `).join('');
  }

  // ---- 2) 集計（枠・申込・残数）：今後開催のイベント ----
  function renderSummary() {
    const grid = document.getElementById('summaryGrid');
    const counts = appsCountsByEvent_();
    const upcoming = appsEventsCache.filter(ev => !isPastDate_(ev.date));
    if (upcoming.length === 0) {
      grid.innerHTML = '<div class="no-events">開催予定のイベントがありません</div>';
      return;
    }
    grid.innerHTML = upcoming.map(ev => summaryCard_(ev, counts, false)).join('');
  }

  // ---- 3) 過去の実績 ----
  function renderPast() {
    const grid = document.getElementById('pastGrid');
    const counts = appsCountsByEvent_();
    const past = appsEventsCache.filter(ev => isPastDate_(ev.date));
    if (past.length === 0) {
      grid.innerHTML = '<div class="no-events">過去の実績はまだありません</div>';
      return;
    }
    grid.innerHTML = past.map(ev => summaryCard_(ev, counts, true)).join('');
  }

  // 集計カード（枠・申込・残数＋充足バー）。past=true は実績表示（残数の代わりに充足率）
  function summaryCard_(ev, counts, past) {
    const cap = parseCapacity_(ev.capacity);
    const applied = counts[ev.event_id] || 0;
    const remain = cap ? Math.max(cap - applied, 0) : null;
    const rate = cap ? Math.min(Math.round((applied / cap) * 100), 100) : 0;
    const thirdCol = past
      ? `<div class="rem"><div class="num">${cap ? rate + '%' : '—'}</div><div class="lbl">充足率</div></div>`
      : `<div class="rem ${remain === 0 ? 'full' : ''}"><div class="num">${remain === null ? '—' : remain}</div><div class="lbl">残数</div></div>`;
    return `
      <div class="summary-card">
        <h4>${ev.title || ev.event_id}</h4>
        <div class="sc-date">${ev.date || ''}${ev.venue_name ? ' ／ ' + ev.venue_name : ''}</div>
        <div class="sc-stats">
          <div class="waku"><div class="num">${cap || '—'}</div><div class="lbl">枠</div></div>
          <div class="app"><div class="num">${applied}</div><div class="lbl">申込</div></div>
          ${thirdCol}
        </div>
        <div class="sc-bar"><div style="width:${rate}%"></div></div>
        <button class="sc-drill" onclick="drillToEvent('${ev.event_id}')">申込一覧を見る →</button>
      </div>`;
  }

  // カードから「イベント別申込」タブへドリルダウン
  function drillToEvent(eventId) {
    const subnavBtns = document.querySelectorAll('.apps-subnav button');
    showAppsTab('byEvent', subnavBtns[0]);
    document.getElementById('filterEventId').value = eventId;
    loadApplications();
  }

  // ---- 4) 一斉配信 ----
  function renderBroadcastEventOptions() {
    const select = document.getElementById('bcEventId');
    if (!select) return;
    select.innerHTML = '<option value="">— イベントを選択 —</option>' +
      appsEventsCache
        .filter(ev => !isPastDate_(ev.date))
        .map(ev => `<option value="${ev.event_id}">${ev.title || ev.event_id} (${ev.date || ''})</option>`)
        .join('');
  }

  // 選んだイベントから件名・本文を自動生成（そのまま送っても、手直ししてもOK）
  function fillBroadcastBody() {
    const id = document.getElementById('bcEventId').value;
    if (!id) return;
    const ev = appsEventsCache.find(e => e.event_id === id);
    if (!ev) return;
    document.getElementById('bcSubject').value = `【三晶プロダクション】${ev.title || ''} のお知らせ`;
    const lines = [];
    lines.push(`${ev.title || ''} を開催いたします。`);
    lines.push('');
    if (ev.date) lines.push(`◆ 日時：${ev.date}${ev.time_start ? ' ' + ev.time_start + '開演' : ''}${ev.time_open ? '（' + ev.time_open + '開場）' : ''}`);
    if (ev.venue_name) lines.push(`◆ 会場：${ev.venue_name}${ev.venue_address ? '（' + ev.venue_address + '）' : ''}`);
    if (ev.venue_access) lines.push(`◆ アクセス：${ev.venue_access}`);
    if (ev.price_general || ev.price_member) {
      const p = [];
      if (ev.price_general) p.push(`一般 ${ev.price_general}`);
      if (ev.price_member) p.push(`会員 ${ev.price_member}`);
      lines.push(`◆ 料金：${p.join(' / ')}`);
    }
    if (ev.program) lines.push(`◆ 演目：${ev.program}`);
    lines.push('');
    lines.push('皆さまのお越しを心よりお待ち申し上げております。');
    lines.push('三遊亭円左衛門 一門');
    document.getElementById('bcBody').value = lines.join('\n');
  }

  // 一斉配信の送信（testOnly=true は自分宛テスト）
  async function sendBroadcast(testOnly) {
    const session = adminSession_();
    const okEl = document.getElementById('bcSuccess');
    const errEl = document.getElementById('bcError');
    okEl.style.display = 'none';
    errEl.style.display = 'none';

    if (!session.email || !session.password) {
      errEl.textContent = 'ログインし直してください。';
      errEl.style.display = 'block';
      return;
    }

    const channel = (document.querySelector('input[name="bcChannel"]:checked') || {}).value || 'both';
    const subject = document.getElementById('bcSubject').value.trim();
    const body = document.getElementById('bcBody').value.trim();

    if (!body) {
      errEl.textContent = '本文を入力してください。';
      errEl.style.display = 'block';
      return;
    }
    if ((channel === 'email' || channel === 'both') && !subject) {
      errEl.textContent = 'メールの件名を入力してください。';
      errEl.style.display = 'block';
      return;
    }

    if (!testOnly) {
      const label = channel === 'email' ? 'メール' : channel === 'line' ? 'LINE' : 'メールとLINE';
      if (!confirm(`本当に全員へ${label}で一斉配信しますか？\nこの操作は取り消せません。`)) return;
    }

    const testBtn = document.getElementById('bcTestBtn');
    const sendBtn = document.getElementById('bcSendBtn');
    testBtn.disabled = true;
    sendBtn.disabled = true;
    const activeBtn = testOnly ? testBtn : sendBtn;
    const origText = activeBtn.textContent;
    activeBtn.textContent = '送信中…';

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'broadcast',
          email: session.email,
          password: session.password,
          channel: channel,
          subject: subject,
          body: body,
          includeReservations: document.getElementById('bcIncludeRes').checked,
          testOnly: !!testOnly
        })
      });
      const result = await response.json();
      if (result.success) {
        okEl.textContent = result.message || '送信しました。';
        okEl.style.display = 'block';
      } else {
        errEl.textContent = result.message || '送信に失敗しました。';
        errEl.style.display = 'block';
      }
    } catch (e) {
      console.error('broadcast error', e);
      errEl.textContent = '送信に失敗しました：' + e.message;
      errEl.style.display = 'block';
    } finally {
      testBtn.disabled = false;
      sendBtn.disabled = false;
      activeBtn.textContent = origText;
    }
  }
</script>
